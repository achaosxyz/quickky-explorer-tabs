name: Windows smoke

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release scripts
        shell: pwsh
        run: ./scripts/test-release.ps1
      - name: Build, smoke-test, and package x64
        shell: pwsh
        run: ./scripts/build.ps1 -Generator 'Visual Studio 17 2022'
